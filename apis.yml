apis:
  - aid: mutual-of-omaha-insurance-benefits-administration-apis
    name: Mutual of Omaha Benefits Administration APIs
    description: >-
      Mutual of Omaha's Workplace Solutions API program for group and voluntary
      benefits, delivered to brokers and employers through benefits administration
      platforms rather than a first-party developer portal. Three capabilities are
      marketed: Plan Setup (pushing plan, rate and eligibility rules into the
      benefits administration platform), Evidence of Insurability (EOI questions
      and automated decisions inside the enrollment flow), and Enrollment
      (real-time election updates passed from the benefits administration platform
      to Mutual of Omaha). Live platform connections named by the company are ADP
      Workforce Now, bswift, Employee Navigator and PlanSource, with Workday and
      further Employee Navigator EOI connections announced for 2026. No public
      OpenAPI, reference or developer portal was found for these APIs.
    humanURL: https://view.mutualofomaha.com/mutual-of-omaha-api-connections
    baseURL: null
    x-base-url-note: >-
      No base URL is published. repair-api-bases.py returns verdict `missing`, and
      the docs pass confirms it: Mutual of Omaha ships no API reference or developer
      portal that names a host. A gateway does exist at https://api.mutualofomaha.com
      (nginx 403 at the root, 404 on every probed path, TLS live), but no Mutual of
      Omaha document states that it is the base for the benefits-administration APIs,
      so it is recorded as an observation and NOT asserted as baseURL. Left missing
      rather than guessed from the domain.
