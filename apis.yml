description: >-
  Mutual of Omaha is a Fortune 500 mutual insurance and financial services company
  headquartered in Omaha, Nebraska, providing life, disability, dental, vision,
  critical illness, accident and long-term care insurance, Medicare supplement and
  Medicare Advantage plans, annuities, retirement services, mortgage lending and
  investment products to individuals, employers and groups across the United States.
  Its Workplace Solutions unit runs an API integration program for group and
  voluntary benefits — Plan Setup, Evidence of Insurability and Enrollment — but
  those APIs are delivered through benefits administration platform partners such as
  ADP Workforce Now, bswift, Employee Navigator and PlanSource rather than through a
  public developer portal, and no machine-readable contract is published.
