note: >-
  Mutual of Omaha publishes no plans, tiers or pricing for its API program. The
  APIs are not sold as a product: they are integration connections between Mutual
  of Omaha and a broker's or employer's benefits administration platform (ADP
  Workforce Now, bswift, Employee Navigator, PlanSource), provisioned as part of a
  group insurance relationship. There is no developer signup, no metered plan, and
  no rate card. The insurance products themselves are quoted per group and are not
  API pricing.
